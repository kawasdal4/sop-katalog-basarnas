name: "Release Desktop App"

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: ./desktop
        run: npm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin' }}

      - name: Build and Release Tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./desktop"
          tauriScript: "npm run tauri"
          tagName: "desktop-v__VERSION__"
          releaseName: "E-Katalog SOP Desktop v__VERSION__"
          releaseBody: "Automated multi-platform desktop release."
          releaseDraft: false
          prerelease: false

      - name: Notify Web App API (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          $config = Get-Content "./desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version
          $repo = "${{ github.repository }}"
          $tag = "desktop-v$version"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/E-Katalog.SOP_${version}_x64-setup.exe"
          $sigUrl = "$downloadUrl.sig"
          try {
            $sig = Invoke-RestMethod -Uri $sigUrl
          } catch {
            $sig = "NOSIG"
          }
          $body = @{
            version = $version
            notes = "Automated build from commit ${{ github.sha }}"
            signature = $sig
            downloadUrl = $downloadUrl
          } | ConvertTo-Json
          if ($ENV:API_URL -and $ENV:CI_RELEASE_TOKEN) {
            Invoke-RestMethod -Method Post -Uri $ENV:API_URL -Headers @{ "Authorization" = "Bearer $ENV:CI_RELEASE_TOKEN" } -ContentType "application/json" -Body $body
          } else {
            Write-Host "Skipping API notification: Missing secrets."
          }
